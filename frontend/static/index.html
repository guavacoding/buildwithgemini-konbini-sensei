<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAWSON STATION | コンビニ先生 (Konbini Sensei)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
<style>
  :root {
    --lawson-blue: #0068b7;
    --lawson-dark-blue: #004b87;
    --lawson-light-blue: #008cd6;
    --lawson-cyan: #e6f3fa;
    --lawson-yellow: #ffb800;
    --lawson-orange: #ff7a00;
    --lawson-red: #e60012;
    --bg-main: #edf4fa;
    --card-bg: #ffffff;
    --border-color: #cde1f0;
    --text-primary: #1e2d3d;
    --text-secondary: #5a7184;
    --font-jp: 'M PLUS Rounded 1c', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-jp);
    background: var(--bg-main);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- Lawson Striped Header --- */
  header.lawson-header {
    background: var(--lawson-blue);
    background-image: repeating-linear-gradient(
      90deg,
      var(--lawson-blue) 0px,
      var(--lawson-blue) 32px,
      #ffffff 32px,
      #ffffff 64px
    );
    padding: 0;
    box-shadow: 0 4px 12px rgba(0, 104, 183, 0.25);
    z-index: 10;
  }

  .header-inner {
    background: rgba(0, 104, 183, 0.94);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1.5rem;
    color: #ffffff;
  }

  .brand-box {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .milk-badge {
    background: #ffffff;
    color: var(--lawson-blue);
    font-weight: 800;
    font-size: 0.9rem;
    padding: 0.35rem 0.75rem;
    border-radius: 8px;
    letter-spacing: 1px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .brand-title {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .brand-subtitle {
    font-size: 0.8rem;
    background: rgba(255, 255, 255, 0.2);
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    margin-left: 0.5rem;
    font-weight: 500;
  }

  .header-badges {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .status-pill {
    background: rgba(255,255,255,0.92);
    color: var(--lawson-dark-blue);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    display: inline-block;
    box-shadow: 0 0 8px #10b981;
  }

  /* --- Main Container Layout (Character Aside + Chat Stream) --- */
  .app-main {
    flex: 1;
    display: flex;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
    padding: 1rem 1rem 0;
    gap: 1.2rem;
  }

  /* --- Character Showcase Sidebar --- */
  .character-panel {
    width: 320px;
    background: var(--card-bg);
    border-radius: 20px;
    border: 2px solid var(--border-color);
    box-shadow: 0 8px 24px rgba(0, 104, 183, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1.2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .character-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: linear-gradient(135deg, var(--lawson-blue), var(--lawson-light-blue));
    border-radius: 18px 18px 50% 50%;
  }

  .character-avatar-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    margin-top: 10px;
    margin-bottom: 1rem;
    z-index: 1;
  }

  .character-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #ffffff;
    box-shadow: 0 8px 20px rgba(0, 104, 183, 0.22);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
  }

  .character-avatar:hover {
    transform: scale(1.04);
  }

  .emotion-badge {
    position: absolute;
    bottom: 4px;
    right: 8px;
    background: #ffffff;
    border: 2px solid var(--lawson-blue);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .character-name {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--lawson-dark-blue);
    margin-bottom: 0.2rem;
  }

  .character-role {
    font-size: 0.82rem;
    color: var(--text-secondary);
    background: var(--lawson-cyan);
    padding: 0.25rem 0.8rem;
    border-radius: 12px;
    font-weight: 700;
    margin-bottom: 0.8rem;
    border: 1px solid #bde0fe;
  }

  .character-speech-bubble {
    background: #fdfefe;
    border: 2px dashed var(--lawson-light-blue);
    border-radius: 14px;
    padding: 0.8rem 1rem;
    font-size: 0.88rem;
    color: var(--lawson-dark-blue);
    line-height: 1.45;
    margin-top: auto;
    width: 100%;
    box-shadow: inset 0 1px 3px rgba(0, 104, 183, 0.05);
    position: relative;
    font-weight: 500;
  }

  .character-speech-bubble::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 0 10px 10px 10px;
    border-style: solid;
    border-color: transparent transparent var(--lawson-light-blue) transparent;
  }

  /* --- Chat Area --- */
  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border-radius: 20px 20px 0 0;
    border: 2px solid var(--border-color);
    border-bottom: none;
    box-shadow: 0 8px 24px rgba(0, 104, 183, 0.06);
    overflow: hidden;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem 1.4rem;
    scroll-behavior: smooth;
  }

  .msg-row {
    display: flex;
    margin: 1rem 0;
    gap: 0.75rem;
    align-items: flex-start;
  }

  .msg-row.user {
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--lawson-light-blue);
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0, 104, 183, 0.2);
  }

  .msg-user-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .bubble-wrap {
    max-width: 78%;
  }

  .msg-author {
    font-size: 0.76rem;
    color: var(--text-secondary);
    margin-bottom: 0.25rem;
    font-weight: 700;
  }

  .msg-row.user .msg-author {
    text-align: right;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.6;
    word-break: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .msg-row.agent .bubble {
    background: #f8fafc;
    border: 1.5px solid #d9e6f2;
    border-top-left-radius: 4px;
    color: #1e293b;
    white-space: pre-wrap;
  }

  .msg-row.user .bubble {
    background: linear-gradient(135deg, var(--lawson-blue), var(--lawson-light-blue));
    color: #ffffff;
    border-top-right-radius: 4px;
    font-weight: 500;
  }

  .bubble.rich {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    box-shadow: none !important;
    white-space: normal !important;
  }

  /* --- A2UI Card Custom Styling (Lawson Konbini Style) --- */
  .a2card {
    background: #ffffff;
    border: 2px solid #bde0fe;
    border-radius: 16px;
    padding: 1.2rem;
    box-shadow: 0 4px 16px rgba(0, 104, 183, 0.08);
    position: relative;
    overflow: hidden;
  }

  .a2card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--lawson-blue), var(--lawson-yellow), var(--lawson-light-blue));
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 800; color: var(--lawson-dark-blue); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 800; color: var(--lawson-blue); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 700; }
  .a2text.a2-caption { font-size: 0.85rem; color: #64748b; background: var(--lawson-cyan); padding: 0.2rem 0.5rem; border-radius: 6px; display: inline-block; }
  .a2divider { border: none; border-top: 1.5px dashed #cde1f0; margin: 0.6rem 0; width: 100%; }
  
  .a2img {
    max-width: 100%;
    border-radius: 12px;
    display: block;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    border: 2px solid #ffffff;
    transition: transform 0.25s ease;
  }

  .a2img:hover {
    transform: scale(1.02);
  }

  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.3rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--lawson-blue);
  }

  /* --- Quick Suggestion Chips --- */
  .quick-chips-bar {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem 1.2rem;
    background: #f1f7fc;
    border-top: 1px solid var(--border-color);
    overflow-x: auto;
    white-space: nowrap;
  }

  .chip-btn {
    background: #ffffff;
    border: 1px solid #c2dbef;
    color: var(--lawson-dark-blue);
    font-size: 0.82rem;
    font-weight: 700;
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    box-shadow: 0 1px 3px rgba(0, 104, 183, 0.06);
    flex-shrink: 0;
  }

  .chip-btn:hover {
    background: var(--lawson-blue);
    color: #ffffff;
    border-color: var(--lawson-blue);
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0, 104, 183, 0.25);
  }

  /* --- Form & Input Controls --- */
  form#form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.2rem;
    background: #ffffff;
    border-top: 1px solid var(--border-color);
    align-items: center;
  }

  input#input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    border: 2px solid #d0e2f0;
    border-radius: 28px;
    font-size: 0.98rem;
    font-family: var(--font-jp);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fbfdff;
  }

  input#input:focus {
    border-color: var(--lawson-blue);
    box-shadow: 0 0 0 4px rgba(0, 104, 183, 0.15);
    background: #ffffff;
  }

  button.send-btn {
    padding: 0.85rem 1.6rem;
    border: none;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--lawson-blue), var(--lawson-light-blue));
    color: #ffffff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 3px 10px rgba(0, 104, 183, 0.3);
    transition: all 0.2s;
    flex-shrink: 0;
  }

  button.send-btn:hover {
    background: linear-gradient(135deg, var(--lawson-dark-blue), var(--lawson-blue));
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(0, 104, 183, 0.4);
  }

  button.send-btn:active {
    transform: translateY(1px);
  }

  /* --- Mobile Responsive --- */
  @media (max-width: 860px) {
    .app-main { flex-direction: column; padding: 0.5rem; gap: 0.5rem; }
    .character-panel {
      width: 100%;
      height: auto;
      flex-direction: row;
      padding: 0.6rem 1rem;
      border-radius: 14px;
    }
    .character-panel::before { display: none; }
    .character-avatar-wrap {
      width: 60px;
      height: 60px;
      margin: 0;
    }
    .emotion-badge { width: 24px; height: 24px; font-size: 0.9rem; right: -2px; bottom: -2px; }
    .character-name { font-size: 1rem; text-align: left; }
    .character-role { display: none; }
    .character-speech-bubble {
      margin-top: 0;
      margin-left: 0.8rem;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      text-align: left;
    }
    .character-speech-bubble::before { display: none; }
    .brand-subtitle { display: none; }
  }
</style>
</head>
<body>

<header class="lawson-header">
  <div class="header-inner">
    <div class="brand-box">
      <div class="milk-badge">
        <span>🏪</span> LAWSON
      </div>
      <div class="brand-title">
        コンビニ先生
        <span class="brand-subtitle">日本超商日語教學 Station</span>
      </div>
    </div>
    <div class="header-badges">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="headerStatusText">店員勤務中</span>
      </div>
    </div>
  </div>
</header>

<main class="app-main">
  <!-- Character Showcase Panel -->
  <aside class="character-panel">
    <div class="character-avatar-wrap">
      <img id="mainCharacterImg" class="character-avatar" src="/images/sensei_happy.png" alt="コンビニ先生">
      <div id="mainEmotionBadge" class="emotion-badge">😊</div>
    </div>
    <h2 class="character-name">コンビニ先生</h2>
    <span class="character-role">LAWSON 專任日語教學店員</span>
    <div id="characterSpeech" class="character-speech-bubble">
      いらっしゃいませ！歡迎來到 Lawson 便利商店！今天想買點什麼，還是想練習超商日文對話呢？🍙✨
    </div>
  </aside>

  <!-- Chat Log & Interaction Area -->
  <section class="chat-container">
    <div id="log"></div>

    <!-- Quick Suggestion Chips -->
    <div class="quick-chips-bar">
      <button class="chip-btn" data-msg="我想在便利商店買便當並加熱，店員會問我什麼？我該怎麼用日文回答？">
        <span>🍱</span> 便當加熱對話練習
      </button>
      <button class="chip-btn" data-msg="我想買唐揚雞便當，請幫我查詢店內庫存並生成一張美味的商品插圖！">
        <span>🍗</span> 查庫存與美食繪圖
      </button>
      <button class="chip-btn" data-msg="請記住我有花生與堅果過敏，請幫我把關！">
        <span>🥜</span> 設定過敏原記憶
      </button>
      <button class="chip-btn" data-msg="請問日文的「温めますか」是什麼文法結構？">
        <span>📖</span> N5 文法句型解說
      </button>
      <button class="chip-btn" data-msg="請幫我搜尋新宿站附近的便利商店門市">
        <span>🗺️</span> 尋找附近超商
      </button>
    </div>

    <!-- Input Form -->
    <form id="form">
      <input id="input" placeholder="向コンビニ先生發問或練習日語…（例：袋子要怎麼用日文說？）" autocomplete="off" autofocus>
      <button class="send-btn" type="submit">
        <span class="material-symbols-outlined" style="color:#fff; font-size:1.15rem;">send</span>
        <span>送信</span>
      </button>
    </form>
  </section>
</main>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const mainCharacterImg = document.getElementById("mainCharacterImg");
const mainEmotionBadge = document.getElementById("mainEmotionBadge");
const characterSpeech = document.getElementById("characterSpeech");
const headerStatusText = document.getElementById("headerStatusText");

// Character Emotions and Assets
const EMOTIONS = {
  happy: {
    src: "/images/sensei_happy.png",
    badge: "😊",
    status: "親切接客中",
    defaultSpeech: "いらっしゃいませ！有任何日語問題或想買的商品，隨時問我喔！"
  },
  thinking: {
    src: "/images/sensei_thinking.png",
    badge: "🤔",
    status: "查詢思考中...",
    defaultSpeech: "うーん、ちょっと待ってくださいね！先生正在為您查詢資料庫與整理教學重點..."
  },
  excited: {
    src: "/images/sensei_excited.png",
    badge: "✨",
    status: "大好評！元氣滿滿",
    defaultSpeech: "素晴らしい！太棒了！這是特別為您推薦的超商美食與實用語句！"
  },
  worried: {
    src: "/images/sensei_worried.png",
    badge: "⚠️",
    status: "安心把關注意",
    defaultSpeech: "食物過敏是一定要特別小心的！請放心，先生會隨時為您的健康嚴格把關！"
  }
};

let currentEmotion = "happy";

function setEmotion(emotionKey, customSpeech = null) {
  const emo = EMOTIONS[emotionKey] || EMOTIONS.happy;
  currentEmotion = emotionKey;
  mainCharacterImg.src = emo.src;
  mainEmotionBadge.textContent = emo.badge;
  headerStatusText.textContent = emo.status;
  if (customSpeech) {
    characterSpeech.textContent = customSpeech;
  } else if (emotionKey === "thinking") {
    characterSpeech.textContent = emo.defaultSpeech;
  }
}

// Analyze response content to determine character emotion
function detectEmotionFromResponse(text, hasA2UI = false) {
  const lower = (text || "").toLowerCase();
  
  // Allergy / safety check
  if (lower.includes("過敏") || lower.includes("アレルギー") || lower.includes("allergy") || lower.includes("安全") || lower.includes("注意")) {
    return "worried";
  }
  
  // High energy / illustration / successful purchase / points / praise
  if (lower.includes("插圖") || lower.includes("生成") || lower.includes("圖片") || lower.includes("美味") || 
      lower.includes("素晴らしい") || lower.includes("すごい") || lower.includes("恭喜") || lower.includes("ポイント") || 
      lower.includes("購入") || lower.includes("庫存") || lower.includes("現貨") || lower.includes("推薦") || hasA2UI) {
    return "excited";
  }

  return "happy";
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function appendMessage(who, text = "", isPlaceholder = false) {
  const row = el("div", "msg-row " + who);

  if (who === "agent") {
    const avatar = el("img", "msg-avatar");
    avatar.src = EMOTIONS[currentEmotion].src;
    avatar.alt = "先生";
    row.appendChild(avatar);
  } else {
    const userAvatar = el("div", "msg-user-avatar", "客");
    row.appendChild(userAvatar);
  }

  const bubbleWrap = el("div", "bubble-wrap");
  const authorName = el("div", "msg-author", who === "agent" ? "🏪 コンビニ先生" : "顧客（あなた）");
  const bubble = el("div", "bubble", text);
  
  bubbleWrap.appendChild(authorName);
  bubbleWrap.appendChild(bubble);
  row.appendChild(bubbleWrap);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || "商品插圖"; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";

  // Dynamic emotion reaction based on reply content
  const detected = detectEmotionFromResponse(textStr, a2ui.length > 0);
  let speechSummary = null;
  if (detected === "worried") {
    speechSummary = "【安全第一】先生特別注意到過敏原相關事項，請務必確認食品成分安心食用！";
  } else if (detected === "excited") {
    speechSummary = "美味しい！為您找到相關的美食商品與日文練習，一起享受便利商店的樂趣吧！";
  } else {
    speechSummary = "學習日語就像每天逛超商一樣輕鬆，隨時可以跟我練習下一句會話喔！";
  }
  setEmotion(detected, speechSummary);

  // Update this specific message bubble's avatar to match the emotion
  const row = b.closest(".msg-row");
  if (row) {
    const img = row.querySelector(".msg-avatar");
    if (img) img.src = EMOTIONS[detected].src;
  }

  log.scrollTop = log.scrollHeight;
}

async function handleSendMessage(text) {
  if (!text) return;
  appendMessage("user", text);
  input.value = "";

  // Switch character to thinking expression
  setEmotion("thinking");

  const b = appendMessage("agent", "…");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
    setEmotion("worried", "申し訳ありません！連線時發生了一點小狀況，請稍後再試一次看看。");
  }
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  handleSendMessage(input.value.trim());
});

// Quick suggestion chip listeners
document.querySelectorAll(".chip-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const msg = btn.getAttribute("data-msg");
    if (msg) handleSendMessage(msg);
  });
});

window.addEventListener("DOMContentLoaded", () => {
  const welcomeBubble = appendMessage("agent");
  welcomeBubble.textContent = "いらっしゃいませ！歡迎光臨 Lawson！我是店員兼日語導師 コンビニ先生。\n今天想練習哪種超商對話（加熱便當、袋子、點數卡），還是想瀏覽美味的貨架商品呢？";
});
